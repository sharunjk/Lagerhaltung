# Konfiguration Lagerverwaltung
# Fast alles ist auch in der Oberflaeche unter "Einstellungen" aenderbar.

[server]
host = "0.0.0.0"   # 0.0.0.0 = auch von Handscanner/anderen PCs erreichbar, 127.0.0.1 = nur dieser PC
port = 8080        # Adresse am Lager-PC: http://localhost:8080
https_port = 8443  # Handscanner, Smartphones, andere PCs: https://<PC>:8443   (0 = aus)
http_nur_lokal = true  # true = http://...:8080 nur am Lager-PC selbst (localhost); andere Geraete nur verschluesselt ueber https
firmenname = "CAPHENIA"

[daten]
datenbank = "daten/lager.db"   # die komplette Lagerdatenbank (eine Datei)
anhaenge = "daten/anhaenge"    # Fotos und Dokumente

[lager]
negative_bestaende_erlauben = false
lagerplaetze_automatisch_anlegen = true
standard_einheit = "Stk"

[drucker]
modus = "windows"          # windows | netzwerk | datei
name = "HPRT HT100"        # Druckername wie in Windows "Drucker und Scanner"
standard_format = "45x23"  # 45x23 | 60x20
barcode = "128"            # 128 | QR

[backup]
aktiv = true
ordner = "backups"            # Hauptspeicherort (relativ zum Programmordner oder absolut)
uhrzeit = "22:00"             # eine oder mehrere Uhrzeiten, z. B. "07:00, 12:00, 16:00, 22:00"
aufbewahren_tage = 30
nur_bei_aenderung = true      # unveränderten Stand nicht erneut ablegen
# weitere Speicherorte, z. B. externe Festplatte und Netzwerkordner (am einfachsten über Einstellungen -> Datensicherung)
weitere_ziele = []
# weitere_ziele = [{ ordner = "S:\\Lagerbackup", aufbewahren_tage = 90 }, { ordner = "\\\\server\\freigabe\\lager", aufbewahren_tage = 30 }]

[mail]
aktiv = false
